name: Secure CI/CD Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write   # required to upload SARIF to GitHub code scanning

jobs:
  # ============================================================================
  # 1. SECRETS SCANNING — runs first and fast; a leaked credential is the
  #    single most urgent class of finding, so it gates everything downstream.
  # ============================================================================
  secrets-scan:
    name: Secrets scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so Gitleaks can scan past commits too

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Fails the build on any detected secret by default (exit code 1).

  # ============================================================================
  # 2. SAST — static analysis of application source code
  # ============================================================================
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    needs: secrets-scan
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/owasp-top-ten
            p/python
          generateSarif: true

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif

  # ============================================================================
  # 3. SCA (Software Composition Analysis) — known-vulnerable dependencies
  # ============================================================================
  dependency-scan:
    name: Dependency scan (pip-audit)
    runs-on: ubuntu-latest
    needs: secrets-scan
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run pip-audit
        run: |
          pip install pip-audit
          pip-audit -r app/requirements.txt --format json --output pip-audit-report.json
          pip-audit -r app/requirements.txt   # human-readable output + non-zero exit on findings

      - name: Upload dependency report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pip-audit-report
          path: pip-audit-report.json

  # ============================================================================
  # 4. CONTAINER / IMAGE SCANNING — build once, scan before it goes anywhere
  # ============================================================================
  container-scan:
    name: Container scan (Trivy)
    runs-on: ubuntu-latest
    needs: [sast, dependency-scan]
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t devsecops-demo:${{ github.sha }} ./app

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: devsecops-demo:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'   # fail the build on CRITICAL/HIGH findings

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Generate SBOM (Syft)
        if: always()
        uses: anchore/sbom-action@v0
        with:
          image: devsecops-demo:${{ github.sha }}
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sbom
          path: sbom.cyclonedx.json

  # ============================================================================
  # 5. DAST — dynamic scan against the running app (PRs only, ephemeral env)
  # ============================================================================
  dast:
    name: DAST (OWASP ZAP baseline)
    runs-on: ubuntu-latest
    needs: container-scan
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Start target container
        run: |
          docker build -t devsecops-demo:test ./app
          docker run -d -p 5000:5000 --name target devsecops-demo:test
          sleep 5

      - name: Run ZAP baseline scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:5000'
          fail_action: true   # fail the PR check on findings above threshold
          rules_file_name: '.zap/rules.tsv'

      - name: Tear down target
        if: always()
        run: docker rm -f target

  # ============================================================================
  # 6. DEPLOY — only reachable if every gate above passed, and only on main
  # ============================================================================
  deploy:
    name: Deploy (placeholder)
    runs-on: ubuntu-latest
    needs: [sast, dependency-scan, container-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production   # GitHub Environment protection = manual approval
    steps:
      - run: echo "All gates passed - deploy step would run here."
